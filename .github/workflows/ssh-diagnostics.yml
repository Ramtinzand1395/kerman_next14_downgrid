name: Diagnose production SSH

on:
  workflow_dispatch:
  push:
    branches: [fix/actions-ssh-deploy]
    paths: [.github/workflows/ssh-diagnostics.yml]

permissions:
  contents: read

jobs:
  connection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record runner source address for VPS packet capture
        run: |
          date -u
          echo 'Runner public IPv4 (match this source in VPS tcpdump):'
          curl -4 --fail --silent --show-error --max-time 10 https://checkip.amazonaws.com || true
      - name: Compare origin web-port reachability
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          python3 -u - <<'PY'
          import os, socket
          host = os.environ['SSH_HOST'].strip()
          if not host:
              raise SystemExit('SERVER_HOST is missing')
          for port in (80, 443):
              try:
                  with socket.create_connection((host, port), timeout=5):
                      print(f'Origin TCP port {port}: connected')
              except OSError as error:
                  print(f'Origin TCP port {port}: {type(error).__name__}')
          PY
      - name: Test TCP and SSH banner without deployment
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: node scripts/check-deploy-ssh.mjs
