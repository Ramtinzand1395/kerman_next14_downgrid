name: Diagnose production SSH

on:
  workflow_dispatch:
  push:
    branches: [fix/actions-ssh-deploy]
    paths: [.github/workflows/ssh-diagnostics.yml]

permissions:
  contents: read

jobs:
  connection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Test TCP and SSH banner without deployment
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          python3 - <<'PY'
          import os, socket, sys, time
          host = os.environ['SSH_HOST'].strip()
          if not host:
              sys.exit('SERVER_HOST is missing')
          port = int(os.environ['SSH_PORT'])
          for attempt in range(1, 4):
              try:
                  with socket.create_connection((host, port), timeout=10) as connection:
                      connection.settimeout(10)
                      banner = connection.recv(255).decode('ascii', 'replace').strip()
                      if not banner.startswith('SSH-'):
                          raise RuntimeError('The port did not return an SSH banner')
                      print(f'Attempt {attempt}: TCP connected; SSH banner received.')
                      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                          summary.write('SSH network connection: **passed**. No deployment commands executed.\n')
                      sys.exit(0)
              except (OSError, RuntimeError) as error:
                  print(f'Attempt {attempt}/3: {type(error).__name__}: {error}')
                  if attempt < 3:
                      time.sleep(5)
          sys.exit('SSH network connection failed before authentication or deployment.')
          PY
