name: VPS SSH connection smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-only:
    name: Verify GitHub Actions can connect to VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Configure SSH with pinned known_hosts
        shell: bash
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_DEPLOY_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Read-only remote identity check
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          actual="$(ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -p "$port" "$VPS_USER@$VPS_HOST" 'whoami')"
          [[ "$actual" == "$VPS_USER" ]] || { echo "Unexpected SSH identity"; exit 1; }
          echo "SSH_SMOKE_SUCCESS: authenticated remote user verified"
