name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERS }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -e

            echo "Loading Node.js environment..."
            export NVM_DIR="/home/ramtin/.nvm"
            source "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/home/ramtin/.nvm/versions/node/v24.21.0/bin"

            echo "Checking versions..."
            node -v
            npm -v
            pm2 -v

            echo "Going to project directory..."
            cd /home/ramtin/projects/kerman_next14_downgrid

            echo "Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building project..."
            npm run build

            echo "Restarting application..."
            pm2 restart kermanatari --update-env

            echo "Saving PM2 process list..."
            pm2 save

            echo "Checking application status..."
            pm2 status kermanatari

            echo "Deploy completed successfully."