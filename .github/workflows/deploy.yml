name: Deploy on Production server

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via ssh
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERS }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |

            cd /home/ramtin/projects/kerman_next14_downgrid

            echo "pulling new changes..."
            git pull origin main

            echo "installing modules..."
            npm install

            echo "running build..." 
            npm run build

            echo "restarting app..."
            pm2 restart kermanAtari 

