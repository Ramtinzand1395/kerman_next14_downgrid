name: Publish validated release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-pointer
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish validated main SHA to vps-release
        env:
          VALIDATED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATED_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$VALIDATED_SHA" ]] || { echo 'main advanced; newer run will publish'; exit 0; }
          git push origin "${VALIDATED_SHA}:refs/heads/vps-release"
